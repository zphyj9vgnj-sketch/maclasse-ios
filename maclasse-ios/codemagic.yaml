# Fabrication de l'app « Ma classe de maternelle » sur les Mac de Codemagic (aucun Mac personnel nécessaire).
# Prérequis : l'intégration App Store Connect nommée Eclaircie-ASC (la même que pour Éclaircie)
# et le groupe de variables « code-signing » contenant CERTIFICATE_PRIVATE_KEY.
workflows:
  maclasse-ios:
    name: Ma classe de maternelle iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Eclaircie-ASC
    environment:
      groups:
        - code-signing
      vars:
        BUNDLE_ID: "fr.maclasse.maternelle"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Installer les dépendances
        script: npm ci
      - name: Viser iOS 15 minimum
        script: |
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/platform :ios, '14.0'/platform :ios, '15.0'/" ios/App/Podfile
      - name: Synchroniser Capacitor
        script: npx cap sync ios
      - name: Installer les pods
        script: cd ios/App && pod install
      - name: Préparer le trousseau de signature
        script: keychain initialize
      - name: Récupérer ou créer les fichiers de signature chez Apple
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Ajouter le certificat au trousseau
        script: keychain add-certificates
      - name: Régler la signature du projet
        script: xcode-project use-profiles
      - name: Numéro de version (1.0)
        script: |
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = 1.0;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Numéro de build
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Fabriquer l'app
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
